# Build the JupyterLite site and the Jupyter Book from jupyterlite/ and publish
# them on GitHub Pages. The notebooks read precomputed results on fully
# synthetic data that are committed in jupyterlite/content/data, so the build
# needs no PyMC and no real data.
#
# One-time setup by a repository admin: Settings -> Pages -> Source: GitHub Actions.
name: JupyterLite site

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['jupyterlite/**', '.github/workflows/jupyterlite.yml']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install build tools
        run: pip install -r jupyterlite/requirements-build.txt
      - name: Build JupyterLite
        working-directory: jupyterlite
        run: jupyter lite build --output-dir ../_site
      - name: Build Jupyter Book
        working-directory: jupyterlite/content
        env:
          BASE_URL: /${{ github.event.repository.name }}/book
        run: |
          jupyter book build --html
          cp -r _build/html ../../_site/book
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
